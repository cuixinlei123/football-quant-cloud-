name: 运行我的脚本

on:
  push:
    branches:
      - 主要的

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # 1. 把代码下载下来
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' 

      # 3. 【关键修正】运行你的脚本
      - name: Run Python
        run: python 足球量子云.py
