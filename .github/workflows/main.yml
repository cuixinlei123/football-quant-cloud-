yaml

name: 运行脚本

on:

push:

branches:

• main

workflow_dispatch:

jobs:

运行任务:

runs-on: ubuntu-latest

steps:

• name: 检出代码

uses: actions/checkout@v4

• name: 设置 Python 环境

uses: actions/setup-python@v4

with:

python-version: '3.12'

• name: 安装依赖

run: |

python -m pip install --upgrade pip

if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

• name: 执行 Python 脚本

run: |

python main.py
